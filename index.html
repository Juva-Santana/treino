<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16212d">
<title>Seu treino · Cimerian</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;700;800&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --grafite: #16212d;
    --grafite-2: #1f2d3c;
    --aco: #8fa3b8;
    --papel: #f2f5f8;
    --tempo: #f39c12;
    --distancia: #3498db;
    --elevacao: #9b59b6;
    --calorias: #e74c3c;
    --meta: #2ecc71;
    --cond: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
    --texto: "Barlow", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--grafite);
    color: var(--papel);
    font: 400 16px/1.45 var(--texto);
    padding: env(safe-area-inset-top, 0) 0 env(safe-area-inset-bottom, 0);
    -webkit-font-smoothing: antialiased;
  }
  main { max-width: 460px; margin: 0 auto; padding: 22px 20px 32px; }

  header { display: flex; justify-content: space-between; align-items: baseline; }
  .marca { font: 800 22px/1 var(--cond); letter-spacing: .08em; }
  .data { color: var(--aco); font-size: 14px; }

  /* Destaque: a distância sobre as ripas da lona da esteira */
  .lona {
    position: relative; margin: 26px -20px 0; padding: 26px 20px 22px;
    background:
      repeating-linear-gradient(90deg, rgba(255,255,255,.055) 0 3px, transparent 3px 22px),
      linear-gradient(180deg, var(--grafite-2), var(--grafite));
    background-size: 22px 100%, 100% 100%;
    border-top: 3px solid var(--distancia);
    overflow: hidden;
  }
  @media (prefers-reduced-motion: no-preference) {
    .lona { animation: correr 1.6s cubic-bezier(.2,.7,.2,1) both; }
    @keyframes correr { from { background-position: 220px 0, 0 0; } to { background-position: 0 0, 0 0; } }
  }
  .distancia { font: 800 clamp(88px, 30vw, 132px)/.86 var(--cond); letter-spacing: -.01em; }
  .distancia small { font-size: .34em; font-weight: 700; margin-left: 6px; color: var(--distancia); }
  .resumo-linha { margin-top: 10px; font-size: 18px; color: #d6dee7; }
  .resumo-linha b { font-weight: 600; color: var(--papel); }

  .meta {
    display: inline-flex; align-items: center; gap: 8px; margin-top: 16px;
    padding: 6px 12px 6px 8px; border-radius: 999px;
    background: rgba(46,204,113,.14); color: var(--meta); font-weight: 600; font-size: 15px;
  }
  .meta svg { width: 18px; height: 18px; }

  .numeros { display: grid; grid-template-columns: 1fr 1fr; gap: 1px; margin-top: 24px;
             background: rgba(143,163,184,.22); border-radius: 14px; overflow: hidden; }
  .numero { background: var(--grafite); padding: 14px 16px 16px; }
  .numero span { display: block; color: var(--aco); font-size: 14px; }
  .numero strong { display: block; margin-top: 2px; font: 700 34px/1 var(--cond); }
  .numero strong em { font-style: normal; font-size: .52em; font-weight: 500; color: var(--aco); margin-left: 3px; }
  .numero::before { content: ""; display: block; width: 26px; height: 4px; border-radius: 2px; margin-bottom: 10px; background: var(--cor); }

  .acoes { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 26px; }
  button {
    font: 600 16px/1 var(--texto); padding: 15px 12px; border-radius: 12px; cursor: pointer;
    border: 2px solid var(--papel); background: transparent; color: var(--papel);
  }
  button.principal { background: var(--papel); color: var(--grafite); }
  button:focus-visible { outline: 3px solid var(--distancia); outline-offset: 2px; }
  button:active { transform: translateY(1px); }
  .aviso { min-height: 20px; margin-top: 12px; text-align: center; color: var(--aco); font-size: 14px; }
  footer { margin-top: 18px; color: var(--aco); font-size: 13px; text-align: center; }

  .vazio { margin-top: 30vh; text-align: center; }
  .vazio p { color: #d6dee7; max-width: 30ch; margin: 10px auto 0; }
</style>
</head>
<body>
<main id="app"></main>

<script>
(function () {
  "use strict";

  var TEXTOS = {
    PT: { titulo: "Seu treino", em: "em", ritmo: "Ritmo médio", tempo: "Tempo", elevacao: "Elevação",
          calorias: "Calorias", velocidade: "Velocidade média", meta: "Meta concluída",
          compartilhar: "Compartilhar", salvar: "Salvar imagem", rodape: "Treino feito numa esteira Cimerian",
          vazioTitulo: "Nenhum treino aqui ainda",
          vazioTexto: "Escaneie o QR code que aparece na esteira no fim do treino para ver o seu resultado.",
          salvo: "Imagem salva.", copiado: "Resumo copiado. É só colar onde quiser.",
          semCompartilhar: "Este navegador não permite compartilhar. Use Salvar imagem." },
    EN: { titulo: "Your workout", em: "in", ritmo: "Average pace", tempo: "Time", elevacao: "Elevation",
          calorias: "Calories", velocidade: "Average speed", meta: "Goal complete",
          compartilhar: "Share", salvar: "Save image", rodape: "Workout done on a Cimerian treadmill",
          vazioTitulo: "No workout here yet",
          vazioTexto: "Scan the QR code shown on the treadmill at the end of your workout to see your result.",
          salvo: "Image saved.", copiado: "Summary copied. Paste it wherever you like.",
          semCompartilhar: "This browser can't share. Use Save image." },
    ES: { titulo: "Tu entrenamiento", em: "en", ritmo: "Ritmo medio", tempo: "Tiempo", elevacao: "Elevación",
          calorias: "Calorías", velocidade: "Velocidad media", meta: "Meta cumplida",
          compartilhar: "Compartir", salvar: "Guardar imagen", rodape: "Entrenamiento hecho en una cinta Cimerian",
          vazioTitulo: "Todavía no hay entrenamiento",
          vazioTexto: "Escanea el código QR que aparece en la cinta al final del entrenamiento para ver tu resultado.",
          salvo: "Imagen guardada.", copiado: "Resumen copiado. Pégalo donde quieras.",
          semCompartilhar: "Este navegador no permite compartir. Usa Guardar imagen." }
  };

  // Dados vêm depois do "#" no link do QR code (não são enviados a nenhum servidor)
  var p = new URLSearchParams(location.hash.replace(/^#/, ""));
  var idioma = (p.get("l") || "PT").toUpperCase();
  var T = TEXTOS[idioma] || TEXTOS.PT;
  document.documentElement.lang = idioma === "EN" ? "en" : (idioma === "ES" ? "es" : "pt-BR");
  var app = document.getElementById("app");

  function num(nome) { var v = parseFloat(p.get(nome)); return isFinite(v) && v >= 0 ? v : null; }
  var seg = num("t"), km = num("d"), elev = num("e"), kcal = num("c");

  if (seg === null || km === null) {
    app.innerHTML = '<div class="vazio"><div class="marca">CIMERIAN</div><h1>' + T.vazioTitulo +
                    "</h1><p>" + T.vazioTexto + "</p></div>";
    return;
  }

  var decimal = idioma === "EN" ? "." : ",";
  function fmtNum(v, casas) { return v.toFixed(casas).replace(".", decimal); }
  function fmtTempo(s) {
    s = Math.round(s);
    var h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), r = s % 60;
    function dois(n) { return (n < 10 ? "0" : "") + n; }
    return h ? h + ":" + dois(m) + ":" + dois(r) : dois(m) + ":" + dois(r);
  }
  function fmtRitmo() {
    if (km < 0.05) { return "–"; }
    var s = Math.round(seg / km), m = Math.floor(s / 60), r = s % 60;
    return m + "'" + (r < 10 ? "0" : "") + r + '"';
  }
  function fmtData() {
    var bruto = p.get("dt");
    var d = bruto ? new Date(bruto) : null;
    if (!d || isNaN(d)) { return ""; }
    return d.toLocaleDateString(document.documentElement.lang, { day: "2-digit", month: "short", year: "numeric" }) +
           ", " + d.toLocaleTimeString(document.documentElement.lang, { hour: "2-digit", minute: "2-digit" });
  }
  var velMedia = seg > 0 ? km / (seg / 3600) : 0;
  var meta = p.get("m") === "1";

  document.title = T.titulo + " · Cimerian";
  app.innerHTML =
    '<header><span class="marca">CIMERIAN</span><span class="data">' + fmtData() + "</span></header>" +
    '<section class="lona" aria-label="' + T.titulo + '">' +
      '<div class="distancia">' + fmtNum(km, 2) + "<small>km</small></div>" +
      '<div class="resumo-linha">' + T.em + " <b>" + fmtTempo(seg) + "</b>, " +
        fmtNum(velMedia, 1) + " km/h</div>" +
      (meta ? '<div class="meta"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" ' +
              'stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>' +
              T.meta + "</div>" : "") +
    "</section>" +
    '<section class="numeros">' +
      '<div class="numero" style="--cor:var(--tempo)"><span>' + T.tempo + "</span><strong>" + fmtTempo(seg) + "</strong></div>" +
      '<div class="numero" style="--cor:var(--distancia)"><span>' + T.ritmo + "</span><strong>" + fmtRitmo() + "<em>/km</em></strong></div>" +
      '<div class="numero" style="--cor:var(--elevacao)"><span>' + T.elevacao + "</span><strong>" + Math.round(elev || 0) + "<em>m</em></strong></div>" +
      '<div class="numero" style="--cor:var(--calorias)"><span>' + T.calorias + "</span><strong>" + Math.round(kcal || 0) + "<em>kcal</em></strong></div>" +
    "</section>" +
    '<div class="acoes"><button class="principal" id="compartilhar">' + T.compartilhar + "</button>" +
    '<button id="salvar">' + T.salvar + "</button></div>" +
    '<div class="aviso" id="aviso" role="status"></div>' +
    "<footer>" + T.rodape + "</footer>";

  var aviso = document.getElementById("aviso");
  function avisar(texto) { aviso.textContent = texto; }

  var textoResumo = T.titulo + " (Cimerian)\n" + fmtNum(km, 2) + " km " + T.em + " " + fmtTempo(seg) +
    "\n" + T.ritmo + ": " + fmtRitmo() + "/km\n" + T.elevacao + ": " + Math.round(elev || 0) + " m\n" +
    T.calorias + ": " + Math.round(kcal || 0) + " kcal" + (meta ? "\n" + T.meta : "");

  // Imagem do treino (para salvar ou compartilhar como foto)
  function desenharImagem() {
    var c = document.createElement("canvas"), W = 1080, H = 1350;
    c.width = W; c.height = H;
    var g = c.getContext("2d");
    g.fillStyle = "#16212d"; g.fillRect(0, 0, W, H);
    g.fillStyle = "rgba(255,255,255,0.05)";
    for (var x = 0; x < W; x += 44) { g.fillRect(x, 300, 6, 420); }
    g.fillStyle = "#3498db"; g.fillRect(0, 294, W, 6);
    var cond = '"Barlow Condensed", "Arial Narrow", sans-serif', txt = '"Barlow", Arial, sans-serif';
    g.fillStyle = "#f2f5f8"; g.font = "800 56px " + cond; g.fillText("CIMERIAN", 80, 140);
    g.fillStyle = "#8fa3b8"; g.font = "500 38px " + txt; g.fillText(fmtData(), 80, 200);
    g.fillStyle = "#f2f5f8"; g.font = "800 290px " + cond;
    var dist = fmtNum(km, 2); g.fillText(dist, 70, 590);
    var largura = g.measureText(dist).width;
    g.fillStyle = "#3498db"; g.font = "700 100px " + cond; g.fillText("km", 90 + largura, 590);
    g.fillStyle = "#d6dee7"; g.font = "500 50px " + txt;
    g.fillText(T.em + " " + fmtTempo(seg) + ", " + fmtNum(velMedia, 1) + " km/h", 80, 680);
    var itens = [[T.tempo, fmtTempo(seg), "#f39c12"], [T.ritmo, fmtRitmo() + "/km", "#3498db"],
                 [T.elevacao, Math.round(elev || 0) + " m", "#9b59b6"], [T.calorias, Math.round(kcal || 0) + " kcal", "#e74c3c"]];
    itens.forEach(function (it, i) {
      var cx = 80 + (i % 2) * 480, cy = 800 + Math.floor(i / 2) * 200;
      g.fillStyle = it[2]; g.fillRect(cx, cy, 60, 8);
      g.fillStyle = "#8fa3b8"; g.font = "500 38px " + txt; g.fillText(it[0], cx, cy + 62);
      g.fillStyle = "#f2f5f8"; g.font = "700 80px " + cond; g.fillText(it[1], cx, cy + 145);
    });
    if (meta) { g.fillStyle = "#2ecc71"; g.font = "600 46px " + txt; g.fillText("✓ " + T.meta, 80, 1250); }
    return c;
  }

  function nomeArquivo() { return "treino-cimerian.png"; }

  document.getElementById("salvar").addEventListener("click", function () {
    var c = desenharImagem();
    c.toBlob(function (blob) {
      var arquivo = new File([blob], nomeArquivo(), { type: "image/png" });
      if (navigator.canShare && navigator.canShare({ files: [arquivo] })) {
        navigator.share({ files: [arquivo] }).catch(function () {});   // no celular: "Salvar imagem"
        return;
      }
      var a = document.createElement("a");
      a.href = URL.createObjectURL(blob); a.download = nomeArquivo();
      document.body.appendChild(a); a.click(); a.remove();
      avisar(T.salvo);
    }, "image/png");
  });

  document.getElementById("compartilhar").addEventListener("click", function () {
    if (navigator.share) {
      desenharImagem().toBlob(function (blob) {
        var arquivo = new File([blob], nomeArquivo(), { type: "image/png" });
        var dados = { title: T.titulo, text: textoResumo };
        if (navigator.canShare && navigator.canShare({ files: [arquivo] })) { dados.files = [arquivo]; }
        navigator.share(dados).catch(function () {});
      }, "image/png");
    } else if (navigator.clipboard) {
      navigator.clipboard.writeText(textoResumo).then(function () { avisar(T.copiado); },
                                                      function () { avisar(T.semCompartilhar); });
    } else {
      avisar(T.semCompartilhar);
    }
  });
})();
</script>
</body>
</html>
